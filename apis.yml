aid: minersai
name: Minersai
description: MinersAI applies artificial intelligence and machine learning to geoscience
  data for mineral exploration, mining operations, public geological authorities, and
  mining & minerals investors. Founded and run by geologists (CEO Tomi de Lophem, CTO
  Mason Dykstra) and backed by Speedinvest and the Creative Destruction Lab, MinersAI
  structures, cleans, QCs, feature-engineers, and standardizes geochemical, geophysical,
  and remote-sensing datasets, then applies anomaly detection, heatmap generation,
  dimensionality reduction, and geostatistical interpolation to surface high-potential
  exploration targets. Its "geologists-in-the-loop" approach keeps domain experts central
  rather than replacing their expertise. The platform is delivered as a gated web
  application (app.minersai.com); there is no public developer API surface at this time.
